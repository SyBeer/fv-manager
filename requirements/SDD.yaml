# Konfiguracja procesu SDD dla tego projektu
project: "FV Manager"
level: full            # full | light
kind: monolith         # monolith | service - service: wdrazany osobno, rozmawia z reszta tylko przez kontrakt
owners:                # role biznesowe, ktore zatwierdzaja (rola, nie osoba)
  - role: "właściciel instalacji"
    approves: [R, D, GLOSSARY, BR]
gate_blocking_status: "blokuje go-live"   # etykieta pytan blokujacych
backlog: redmine       # none | linear | jira | file
copy: remote           # local | remote - remote: kopia requirements/ wysylana na serwer (origin), galaz sdd-kopia/...
redmine_url: "http://192.168.1.4:3001"
redmine_project: "fv-manager"
redmine_ac_field: "Kryteria akceptacji"   # pole wlasne Redmine na kryteria (wymagane przy zmianie statusu)
redmine_uat_link: "http://homeassistant.local:8123/app/98009506_fv-manager"   # pole "Link do środowiska UAT" (obowiązkowe w przepływie)
